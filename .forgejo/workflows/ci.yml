# Forgejo CI (Runner gm-hosting). Prüfung bei jedem Push und Pull Request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.gm-itsolutions.de/gm-actions/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src
      # Skill-Ordner nur zeigen lassen, nicht anlegen
      - run: SKILLS_DIR=$RUNNER_TEMP/s FILES_DIR=$RUNNER_TEMP/f python -c 'import src.server'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.gm-itsolutions.de/gm-actions/actions-checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ci-test .
